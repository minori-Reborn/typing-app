<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆめかわ えいご タイピング</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #fce4ec;
      --card-bg: #ffffffd0;
      --primary: #ff80ab;
      --accent: #7c4dff;
      --text: #4a148c;
    }
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: linear-gradient(135deg, #ffe6f0 0%, #e8eaf6 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }
    .container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 25px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 10px 25px rgba(255, 128, 171, 0.2);
      border: 4px solid #fff;
      text-align: center;
    }
    h1 {
      color: var(--primary);
      font-size: 26px;
      margin: 0 0 10px 0;
      text-shadow: 2px 2px 0px #fff;
    }
    .mode-select {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 12px;
    }
    .btn {
      background: #fff;
      border: 3px solid var(--primary);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }
    .btn.active, .btn:hover {
      background: var(--primary);
      color: #fff;
      transform: scale(1.05);
    }
    .controls {
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 13px;
      color: #7b1fa2;
      font-weight: bold;
    }
    select {
      padding: 5px 10px;
      border-radius: 15px;
      border: 2px solid var(--primary);
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      outline: none;
      background: #fff;
    }
    .score-board {
      font-size: 18px;
      margin-bottom: 12px;
      color: #ab47bc;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
      position: relative;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .japanese {
      font-size: 22px;
      color: #5c6bc0;
      margin-bottom: 5px;
    }
    .target-word {
      font-size: 38px;
      letter-spacing: 3px;
      font-weight: bold;
      color: var(--accent);
      min-height: 48px;
      transition: opacity 0.5s;
    }
    .target-word.hidden {
      opacity: 0;
    }
    .hint-msg {
      font-size: 16px;
      color: #ff4081;
      font-weight: bold;
      min-height: 22px;
      margin-top: 5px;
    }
    .action-btns {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .icon-btn {
      background: #e1bee7;
      border: none;
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 3px 0 #ba68c8;
    }
    .icon-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .input-display {
      font-size: 32px;
      letter-spacing: 3px;
      color: #26a69a;
      min-height: 40px;
      border-bottom: 3px dashed var(--primary);
      margin-bottom: 10px;
      display: inline-block;
      padding: 0 10px;
    }
    .shake {
      animation: shake 0.3s ease-in-out;
      color: #ff5252 !important;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>✨ ゆめかわ タイピング ✨</h1>

  <div class="mode-select">
    <button class="btn active" id="btn-spell" onclick="setMode('spell')">🧠 えいご おぼえ</button>
    <button class="btn" id="btn-roma" onclick="setMode('roma')">✏️ ローマじ</button>
  </div>

  <div class="controls">
    <div>
      🏷️ ジャンル:
      <select id="category-filter" onchange="initGame()">
        <option value="all">★ ぜんぶ ★</option>
        <option value="どうぶつ">どうぶつ</option>
        <option value="いろ">いろ</option>
        <option value="かたち">かたち</option>
        <option value="がっこう">がっこう</option>
        <option value="ばしょ">ばしょ</option>
        <option value="にちじょう">にちじょう</option>
      </select>
    </div>

    <div>
      🗣️ こえ:
      <select id="voice-select" onchange="speakCurrentWord()">
        <option value="">(じどう) おまかせ</option>
      </select>
    </div>
  </div>

  <div class="score-board">
    ⭐ すこあ: <span id="score">0</span> てん
  </div>

  <div class="card">
    <div class="japanese" id="ja-text">にほんご</div>
    <div class="target-word" id="target-text">apple</div>
    <div class="hint-msg" id="hint-text"></div>
    <div class="action-btns">
      <button class="icon-btn" onclick="speakCurrentWord()">🔊 おと</button>
      <button class="icon-btn" onclick="showHint()">💡 つぎの１もじ</button>
    </div>
  </div>

  <div class="input-display" id="input-text">＿</div>
</div>

<script src="words.js"></script>
<script>
  let currentMode = 'spell';
  let currentWordIndex = 0;
  let filteredList = [];
  let typedText = "";
  let score = 0;
  let targetAnswer = "";
  let hideTimer = null;
  let hintTimer = null;
  let missCount = 0;
  let availableVoices = [];

  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    
    availableVoices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    const voiceSelect = document.getElementById('voice-select');
    voiceSelect.innerHTML = '<option value="">(じどう) おまかせ</option>';
    
    availableVoices.forEach((v, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.innerText = `${v.name.replace(/Google|Microsoft|Apple/g, '').trim()} (${v.lang})`;
      voiceSelect.appendChild(option);
    });
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function initGame() {
    score = 0;
    document.getElementById('score').innerText = score;
    currentWordIndex = 0;

    const selectedCat = document.getElementById('category-filter').value;
    if (selectedCat === 'all') {
      filteredList = [...wordList];
    } else {
      filteredList = wordList.filter(w => w.category === selectedCat);
    }

    filteredList.sort(() => Math.random() - 0.5);
    nextQuestion();
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-spell').classList.toggle('active', mode === 'spell');
    document.getElementById('btn-roma').classList.toggle('active', mode === 'roma');
    initGame();
  }

  function nextQuestion() {
    typedText = "";
    missCount = 0;
    document.getElementById('hint-text').innerText = "";
    updateInputDisplay();

    if (filteredList.length === 0) return;

    const q = filteredList[currentWordIndex];
    const targetEl = document.getElementById('target-text');
    targetEl.classList.remove('hidden');

    if (currentMode === 'spell') {
      document.getElementById('ja-text').innerText = `${q.ja} [${q.category}]`;
      targetAnswer = q.en;
      targetEl.innerText = q.en;
      speak(q.en);

      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        targetEl.classList.add('hidden');
      }, 2000);

    } else {
      document.getElementById('ja-text').innerText = `いみ: ${q.ja}`;
      targetAnswer = q.roma;
      targetEl.innerText = q.en;
      speak(q.en);
    }
  }

  function showHint() {
    const nextChar = targetAnswer[typedText.length];
    if (nextChar) {
      const hintEl = document.getElementById('hint-text');
      hintEl.innerText = `つぎは → 「 ${nextChar.toUpperCase()} 」 だよ！`;
      
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {
        hintEl.innerText = "";
      }, 2000);
    }
  }

  function rescueShow() {
    const targetEl = document.getElementById('target-text');
    const hintEl = document.getElementById('hint-text');
    hintEl.innerText = "ちらっと ちぇっく！";
    targetEl.classList.remove('hidden');

    setTimeout(() => {
      if (currentMode === 'spell') {
        targetEl.classList.add('hidden');
      }
      hintEl.innerText = "";
    }, 1500);
  }

  function fireConfetti() {
    confetti({
      particleCount: 40,
      spread: 60,
      origin: { y: 0.7 },
      colors: ['#ff80ab', '#7c4dff', '#80deea', '#ffd54f', '#b388ff']
    });
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    
    window.speechSynthesis.cancel();
    
    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = 'en-US';
    uttr.rate = 0.85; 
    uttr.pitch = 1.1; // 明るめの可愛いトーンに調整

    const selectedVoiceIndex = document.getElementById('voice-select').value;
    if (selectedVoiceIndex !== "" && availableVoices[selectedVoiceIndex]) {
      uttr.voice = availableVoices[selectedVoiceIndex];
    } else {
      const preferred = availableVoices.find(v => 
        v.name.includes('Samantha') || 
        v.name.includes('Karen') || 
        v.name.includes('Victoria') ||
        v.name.includes('Natural') ||
        v.name.includes('Google US English')
      );
      if (preferred) uttr.voice = preferred;
    }

    // エラーハンドリング
    uttr.onerror = (e) => {
      console.log('Speech error:', e);
    };

    window.speechSynthesis.speak(uttr);
  }

  function speakCurrentWord() {
    if (filteredList.length === 0) return;
    const q = filteredList[currentWordIndex];
    speak(q.en);
  }

  function updateInputDisplay() {
    document.getElementById('input-text').innerText = typedText || "＿";
  }

  function shakeInput() {
    const el = document.getElementById('input-text');
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 300);
  }

  // 画面のどこかをクリックしたら音声リストを強制取得（自動再生制限の対策）
  document.addEventListener('click', () => {
    if (availableVoices.length === 0) {
      loadVoices();
    }
  }, { once: true });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace') {
      typedText = typedText.slice(0, -1);
      updateInputDisplay();
      return;
    }

    if (e.key.length === 1 && e.key.match(/[a-z\-]/i)) {
      const nextChar = e.key.toLowerCase();
      const expectedChar = targetAnswer[typedText.length]?.toLowerCase();

      if (nextChar === expectedChar) {
        typedText += nextChar;
        missCount = 0;
        document.getElementById('hint-text').innerText = "";
        updateInputDisplay();

        if (typedText === targetAnswer.toLowerCase()) {
          score += 10;
          document.getElementById('score').innerText = score;
          
          fireConfetti();
          speak("Great!");

          currentWordIndex = (currentWordIndex + 1) % filteredList.length;
          setTimeout(nextQuestion, 700);
        }
      } else {
        shakeInput();
        missCount++;

        if (missCount >= 3) {
          rescueShow();
          missCount = 0;
        }
      }
    }
  });

  window.onload = () => {
    loadVoices();
    initGame();
  };
</script>
</body>
</html>
