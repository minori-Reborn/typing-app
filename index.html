<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゆめかわ えいご タイピング</title>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700,900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      /* パステルレインボー カラー定義 */
      --rainbow-grad: linear-gradient(90deg, #ffb3ba, #ffdfba, #ffffba, #baffc9, #bae1ff, #e8baff);
      --bg-grad: linear-gradient(135deg, #ffe3ec 0%, #e0f2fe 50%, #f3e8ff 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --primary: #f472b6;
      --accent: #8b5cf6;
      --text: #4c1d95;
    }
    
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background: var(--bg-grad);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    /* レインボー枠線のカード */
    .container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 30px;
      width: 90%;
      max-width: 650px;
      box-shadow: 0 12px 32px rgba(236, 72, 153, 0.15);
      border: 6px solid transparent;
      background-clip: padding-box;
      position: relative;
    }
    
    .container::before {
      content: '';
      position: absolute;
      top: -6px; right: -6px; bottom: -6px; left: -6px;
      z-index: -1;
      border-radius: 36px;
      background: var(--rainbow-grad);
    }

    /* レインボータイトルの文字＆白背景ボックス */
    h1 {
      font-size: 26px;
      margin: 0 auto 16px auto;
      padding: 8px 24px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50px;
      display: inline-block;
      color: #ec4899;
      box-shadow: 0 4px 12px rgba(244, 114, 182, 0.2);
      border: 2px solid #fbcfe8;
    }

    .mode-select {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .btn {
      background: #ffffff;
      border: 3px solid #f472b6;
      color: #ec4899;
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: 900;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .btn.active, .btn:hover {
      background: var(--rainbow-grad);
      color: #5b21b6;
      border-color: #c084fc;
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 15px rgba(168, 85, 247, 0.25);
    }

    .controls {
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 15px;
      color: #6b21a8;
      font-weight: bold;
    }

    select {
      padding: 8px 16px;
      border-radius: 20px;
      border: 3px solid #f472b6;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      outline: none;
      background: #ffffff;
      cursor: pointer;
    }

    .score-board {
      font-size: 22px;
      margin-bottom: 15px;
      color: #9333ea;
      font-weight: 900;
      text-shadow: 1px 1px 0px #fff;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: inset 0 0 12px rgba(244, 114, 182, 0.15);
      position: relative;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px dashed #fbcfe8;
    }

    .japanese {
      font-size: 28px;
      color: #6366f1;
      margin-bottom: 6px;
      font-weight: 900;
      min-height: 40px;
    }

    .target-word {
      font-size: 52px;
      letter-spacing: 5px;
      font-weight: 900;
      color: #8b5cf6;
      min-height: 65px;
      transition: opacity 0.3s;
    }

    .target-word.hidden {
      opacity: 0;
    }

    .hint-msg {
      font-size: 18px;
      color: #f43f5e;
      font-weight: 900;
      min-height: 26px;
      margin-top: 6px;
    }

    .action-btns {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .icon-btn {
      background: linear-gradient(135deg, #fef08a, #fbcfe8, #ddd6fe);
      border: none;
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 900;
      color: #5b21b6;
      cursor: pointer;
      box-shadow: 0 4px 0 #c084fc;
      transition: all 0.15s ease;
    }

    .icon-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    /* レインボーライン付きの入力表示 */
    .input-display {
      font-size: 44px;
      letter-spacing: 5px;
      font-weight: 900;
      color: #0d9488;
      min-height: 55px;
      margin-bottom: 10px;
      display: inline-block;
      padding: 4px 24px;
      border-bottom: 5px solid transparent;
      border-image: var(--rainbow-grad) 1;
    }

    .shake {
      animation: shake 0.3s ease-in-out;
      color: #f43f5e !important;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🌈 ゆめかわ パステル タイピング 🌈</h1>

  <div class="mode-select">
    <button class="btn active" id="btn-spell" onclick="setMode('spell')">🧠 えいご おぼえ</button>
    <button class="btn" id="btn-roma" onclick="setMode('roma')">✏️ ローマじ</button>
  </div>

  <div class="controls">
    <div>
      🏷️ じゃんる:
      <select id="category-filter" onchange="initGame()">
        <option value="all">★ ぜんぶ ★</option>
        <option value="どうぶつ">どうぶつ</option>
        <option value="いろ">いろ</option>
        <option value="たべもの">たべもの</option>
        <option value="がっこう">がっこう</option>
        <option value="ばしょ">ばしょ</option>
        <option value="のりもの">のりもの</option>
        <option value="すぽーつ">すぽーつ</option>
        <option value="きるもの">きるもの</option>
        <option value="にちじょう">にちじょう</option>
      </select>
    </div>
  </div>

  <div class="score-board">
    ⭐ すこあ: <span id="score">0</span> てん
  </div>

  <div class="card">
    <div class="japanese" id="ja-text">にほんご</div>
    <div class="target-word" id="target-text">apple</div>
    <div class="hint-msg" id="hint-text"></div>
    <div class="action-btns">
      <button class="icon-btn" onclick="speakCurrentWord()">🔊 おと</button>
      <button class="icon-btn" onclick="showHint()">💡 つぎの１もじ</button>
    </div>
  </div>

  <div class="input-display" id="input-text">＿</div>
</div>

<script src="words.js"></script>
<script>
  let currentMode = 'spell';
  let currentWordIndex = 0;
  let filteredList = [];
  let typedText = "";
  let score = 0;
  let targetAnswer = "";
  let hideTimer = null;
  let hintTimer = null;
  let missCount = 0;
  let samanthaVoice = null;

  const ROMA_VARIANTS = {
    'si': ['shi'], 'shi': ['si'],
    'zi': ['ji'], 'ji': ['zi'],
    'ti': ['chi'], 'chi': ['ti'],
    'tu': ['tsu'], 'tsu': ['tu'],
    'hu': ['fu'], 'fu': ['hu'],
    'sy': ['sh'], 'sh': ['sy'],
    'ty': ['ch'], 'ch': ['ty'],
    'jy': ['j'], 'j': ['jy']
  };

  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    samanthaVoice = voices.find(v => v.name.includes('Samantha')) ||
                   voices.find(v => v.name.includes('Karen') || v.name.includes('Victoria') || (v.lang.startsWith('en') && v.name.includes('Natural')));
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function initGame() {
    score = 0;
    document.getElementById('score').innerText = score;
    currentWordIndex = 0;

    const selectedCat = document.getElementById('category-filter').value;
    if (selectedCat === 'all') {
      filteredList = [...wordList];
    } else {
      filteredList = wordList.filter(w => w.category === selectedCat);
    }

    filteredList.sort(() => Math.random() - 0.5);
    nextQuestion();
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-spell').classList.toggle('active', mode === 'spell');
    document.getElementById('btn-roma').classList.toggle('active', mode === 'roma');
    initGame();
  }

  function nextQuestion() {
    typedText = "";
    missCount = 0;
    document.getElementById('hint-text').innerText = "";
    updateInputDisplay();

    // 動いているタイマーを完全に止める
    if (hideTimer) {
      clearTimeout(hideTimer);
      hideTimer = null;
    }

    if (filteredList.length === 0) return;

    const q = filteredList[currentWordIndex];
    const targetEl = document.getElementById('target-text');
    
    // 表示状態を強制リセット（必ず可視化）
    targetEl.classList.remove('hidden');

    if (currentMode === 'spell') {
      document.getElementById('ja-text').innerText = `${q.ja} [${q.category}]`;
      targetAnswer = q.en.toLowerCase();
      targetEl.innerText = q.en;
      speak(q.en);

      // えいご おぼえモードの時だけ 2秒後に隠す
      hideTimer = setTimeout(() => {
        targetEl.classList.add('hidden');
      }, 2000);

    } else {
      // ローマじモード：日本語は非表示＆単語は「消さずにずっと表示」！
      document.getElementById('ja-text').innerText = "";
      targetAnswer = q.roma.toLowerCase();
      targetEl.innerText = q.en;
      speak(q.en);
    }
  }

  function showHint() {
    const nextChar = targetAnswer[typedText.length];
    if (nextChar) {
      const hintEl = document.getElementById('hint-text');
      hintEl.innerText = `つぎは → 「 ${nextChar.toUpperCase()} 」 だよ！`;
      
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {
        hintEl.innerText = "";
      }, 2000);
    }
  }

  function rescueShow() {
    const targetEl = document.getElementById('target-text');
    const hintEl = document.getElementById('hint-text');
    hintEl.innerText = "ちらっと ちぇっく！";
    targetEl.classList.remove('hidden');

    setTimeout(() => {
      if (currentMode === 'spell') {
        targetEl.classList.add('hidden');
      }
      hintEl.innerText = "";
    }, 1500);
  }

  function fireConfetti() {
    confetti({
      particleCount: 50,
      spread: 70,
      origin: { y: 0.7 },
      colors: ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e8baff']
    });
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    
    window.speechSynthesis.cancel();
    
    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = 'en-US';
    uttr.rate = 0.85; 
    uttr.pitch = 1.1;

    if (samanthaVoice) {
      uttr.voice = samanthaVoice;
    }

    window.speechSynthesis.speak(uttr);
  }

  function speakCurrentWord() {
    if (filteredList.length === 0) return;
    const q = filteredList[currentWordIndex];
    speak(q.en);
  }

  function updateInputDisplay() {
    document.getElementById('input-text').innerText = typedText || "＿";
  }

  function shakeInput() {
    const el = document.getElementById('input-text');
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 300);
  }

  function isValidPrefix(input, target) {
    if (target.startsWith(input)) return true;

    if (currentMode === 'roma') {
      let normInput = input;
      let normTarget = target;
      for (const [key, valList] of Object.entries(ROMA_VARIANTS)) {
        valList.forEach(v => {
          normInput = normInput.replace(v, key);
          normTarget = normTarget.replace(v, key);
        });
      }
      if (normTarget.startsWith(normInput)) return true;
    }
    return false;
  }

  document.addEventListener('click', () => {
    if (!samanthaVoice) {
      loadVoices();
    }
  }, { once: true });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace') {
      typedText = typedText.slice(0, -1);
      updateInputDisplay();
      return;
    }

    if (e.key.length === 1 && e.key.match(/[a-z\-]/i)) {
      const nextChar = e.key.toLowerCase();
      const testText = typedText + nextChar;

      if (isValidPrefix(testText, targetAnswer)) {
        typedText = testText;
        missCount = 0;
        document.getElementById('hint-text').innerText = "";
        updateInputDisplay();

        let isComplete = (typedText === targetAnswer);
        if (currentMode === 'roma') {
          let normInput = typedText;
          let normTarget = targetAnswer;
          for (const [key, valList] of Object.entries(ROMA_VARIANTS)) {
            valList.forEach(v => {
              normInput = normInput.replace(v, key);
              normTarget = normTarget.replace(v, key);
            });
          }
          if (normInput === normTarget) isComplete = true;
        }

        if (isComplete) {
          score += 10;
          document.getElementById('score').innerText = score;
          
          fireConfetti();
          speak("Great!");

          currentWordIndex = (currentWordIndex + 1) % filteredList.length;
          setTimeout(nextQuestion, 700);
        }
      } else {
        shakeInput();
        missCount++;

        if (missCount >= 3) {
          rescueShow();
          missCount = 0;
        }
      }
    }
  });

  window.onload = () => {
    loadVoices();
    initGame();
  };
</script>
</body>
</html>
